<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pemutar Video Satu Per Satu</title>
  <link rel="stylesheet" href="vidhbd.css" />
</head>
<body>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 30px;
    }
    .tombol-menu {
      margin-bottom: 15px;
    }
    button {
      padding: 10px 20px;
      margin: 0 5px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #d3207f;
    }
    button.aktif {
      background-color: #740760;
      color: rgb(253, 252, 255);
    }
    video {
      width: 640px;
      max-width: 90%;
      border-radius: 10px;
      background: #000;
    }
  </style>

  <!-- Tombol untuk memilih video -->
  <div class="tombol-menu">
    <button id="btn1" class="aktif" onclick="gantiVideo('hbdayang.mp4', 'btn1')">Video 1</button>
    <button id="btn2" onclick="gantiVideo('hbdkucing.mp4', 'btn2')">Video 2</button>
    <button id="btn3" onclick="gantiVideo('hbdcantik.mp4', 'btn3')">Video 3</button>
  </div>

  <!-- Hanya ada 1 layar pemutar video -->
  <video id="layarVideo" controls autoplay
    <source src="hbdayang.mp4" type="video/mp4">
  </video>
  <script> 
function gantiVideo(namaFile, idTombol) {
    const pemutar = document.getElementById('layarVideo');

    pemutar.pause();
    pemutar.src = namaFile;
    pemutar.load();

    pemutar.play().catch(error => {
        console.error("Video gagal diputar:", error);
    });

    document.querySelectorAll('button').forEach(btn => {
        btn.classList.remove('aktif');
    });

    document.getElementById(idTombol).classList.add('aktif')} </script>


</body>
</html>
